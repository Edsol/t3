<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280,initial-scale=1">
<title>HyperTizen T3 Probe</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f1a;color:#e7edf7;
    font-family:Arial,Helvetica,sans-serif;}
  .wrap{padding:28px 44px;}
  h1{font-size:28px;margin:0 0 4px;}
  .sub{color:#8ea0bd;font-size:16px;margin-bottom:16px;}
  .verdict{font-size:24px;font-weight:bold;padding:14px 18px;border-radius:12px;
    background:#162036;border:2px solid #2a3a5c;margin-bottom:14px;}
  .ok{color:#49d17a;border-color:#2e7d50;}
  .bad{color:#ff6b6b;border-color:#7d2e2e;}
  .warn{color:#ffd166;border-color:#7d6a2e;}
  .row{display:flex;gap:16px;}
  .col{flex:1;}
  img{max-width:100%;border:1px solid #223049;border-radius:10px;background:#000;}
  pre{font-size:13px;line-height:1.3;background:#0f1626;border:1px solid #223049;
    border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-word;
    max-height:52vh;overflow:auto;}
  .hint{color:#8ea0bd;font-size:15px;margin-top:10px;}
  b{color:#cfe0ff;}
</style>
</head>
<body>
<div class="wrap">
  <h1>HyperTizen&nbsp;&middot;&nbsp;Tizen&nbsp;3 capture (shm)</h1>
  <div class="sub">ENTER = cattura via D-Bus + lettura della shm e ricostruzione dal piano Y.</div>
  <div id="verdict" class="verdict">Pronto. Premi ENTER&hellip;</div>
  <div class="row">
    <div class="col"><img id="shot" alt="(nessuna immagine)"></div>
    <div class="col"><pre id="dump">&hellip;</pre></div>
  </div>
  <div class="hint">Da browser LAN: <b>:8098/shminfo</b> &middot; <b>:8098/shot?off=0</b> &middot; <b>:8098/img</b></div>
</div>
<script>
(function(){
  var BASE='http://127.0.0.1:8098';
  function setV(t,c){var e=document.getElementById('verdict');e.textContent=t;e.className='verdict '+(c||'');}
  function getJSON(path,cb){
    var x=new XMLHttpRequest();x.open('GET',BASE+path,true);
    x.onreadystatechange=function(){if(x.readyState===4)cb(x.status,x.responseText);};
    try{x.send();}catch(e){cb(0,'');}
  }
  function env(){
    getJSON('/',function(st,txt){
      if(st!==200){setV('Servizio non raggiungibile su :8098.','warn');return;}
      setV('Pronto. Premi ENTER…');
      document.getElementById('dump').textContent=txt;
    });
  }
  function shot(){
    setV('Cattura + lettura shm…','warn');
    getJSON('/shot?off=0&bus=1',function(st,txt){
      var d;try{d=JSON.parse(txt);}catch(e){d=null;}
      document.getElementById('dump').textContent=txt;
      if(d&&!d.error){
        var l=d.luma?('luma '+d.luma.min+'..'+d.luma.max+' avg '+d.luma.avg):'';
        setV('shm letta ('+d.shmSize+' byte) '+l,'ok');
        document.getElementById('shot').src=BASE+'/img?ts='+Date.now();
      } else {
        setV('Errore: '+(d?d.error:'risposta non valida'),'bad');
      }
    });
  }
  document.addEventListener('keydown',function(e){if(e.keyCode===13||e.keyCode===403)shot();});
  env();
})();
</script>
</body>
</html>
